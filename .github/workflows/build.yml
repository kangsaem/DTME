name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path app/dtme/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "DTME version $v"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe (PyInstaller, onedir)
        run: |
          pyinstaller --noconfirm --windowed --name DTME --icon assets/dtme.ico --paths app `
            --collect-submodules dtme `
            --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml --exclude-module PySide6.Qt3DCore `
            --exclude-module tkinter `
            app/main.py

      - name: FFmpeg 캐시 불러오기
        uses: actions/cache/restore@v4
        with:
          path: ffmpeg.zip
          key: ffmpeg-zip-none
          restore-keys: ffmpeg-zip-

      # 정상 = 새로 받아 캐시 바꿈 / 장애(504 등) = 캐시로 바로 (v0.16.22, 사용자 확정)
      - name: Add FFmpeg (BtbN GPL build, NVENC/CUDA 포함)
        id: ffdl
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $cached = Test-Path ffmpeg.zip
          $oldHash = if ($cached) { (Get-FileHash ffmpeg.zip).Hash } else { "" }
          $ok = $false
          $tries = if ($cached) { 2 } else { 3 }                 # 캐시 있으면 짧게 시도하고 넘어감
          for ($i = 1; $i -le $tries -and -not $ok; $i++) {
            try { Invoke-WebRequest $url -OutFile ffmpeg_new.zip -TimeoutSec 300; $ok = $true }
            catch { Write-Host "ffmpeg latest 다운로드 실패 ${i}/${tries}: $_"; if ($i -lt $tries) { Start-Sleep -Seconds 10 } }
          }
          if (-not $ok -and -not $cached) {                      # 캐시도 없을 때만: 날짜 붙은 릴리스 → gyan.dev
            $h = @{ Authorization = "Bearer ${{ github.token }}" }
            try {
              $rels = Invoke-RestMethod "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases?per_page=6" -Headers $h
              foreach ($r in $rels) {
                if ($r.tag_name -eq "latest") { continue }
                $a = $r.assets | Where-Object { $_.name -match '^ffmpeg-N-.*-win64-gpl\.zip$' } | Select-Object -First 1
                if (-not $a) { continue }
                try { Write-Host "대신 $($r.tag_name)"; Invoke-WebRequest $a.browser_download_url -OutFile ffmpeg_new.zip -TimeoutSec 300; $ok = $true; break }
                catch { Write-Host "실패 $($r.tag_name): $_" }
              }
            } catch { Write-Host "릴리스 목록 실패: $_" }
            if (-not $ok) {
              try { Write-Host "대신 gyan.dev"; Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.zip" -OutFile ffmpeg_new.zip -TimeoutSec 300; $ok = $true }
              catch { Write-Host "gyan.dev 실패: $_" }
            }
          }
          if ($ok) {
            Move-Item ffmpeg_new.zip ffmpeg.zip -Force
            $fresh = ((Get-FileHash ffmpeg.zip).Hash -ne $oldHash)
            Write-Host "ffmpeg 새로 받음 (캐시와 다름: $fresh)"
            "fresh=$($fresh.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          } elseif ($cached) {
            Write-Host "ffmpeg 다운로드 장애 → 캐시 사용"
            "fresh=false" >> $env:GITHUB_OUTPUT
          } else { throw "ffmpeg 다운로드 실패(캐시도 없음)" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_x
          $bin = Get-ChildItem ffmpeg_x -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force dist/DTME/bin | Out-Null
          Copy-Item $bin.FullName dist/DTME/bin/
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") dist/DTME/bin/
          New-Item -ItemType Directory -Force dist/DTME/luts | Out-Null
          Copy-Item luts/README.txt dist/DTME/luts/
          Copy-Item luts/*.cube dist/DTME/luts/
          New-Item -ItemType Directory -Force dist/DTME/fonts | Out-Null
          Copy-Item fonts/* dist/DTME/fonts/
          New-Item -ItemType Directory -Force dist/DTME/music | Out-Null
          Copy-Item music/* dist/DTME/music/
          Copy-Item assets dist/DTME/ -Recurse -Force
          Copy-Item README.md dist/DTME/사용법.md
          & dist/DTME/bin/ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: FFmpeg 캐시 바꾸기(새로 받았을 때만)
        if: steps.ffdl.outputs.fresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: ffmpeg.zip
          key: ffmpeg-zip-${{ github.run_id }}

      - name: Smoke test (engine)
        shell: pwsh
        run: |
          & dist/DTME/bin/ffmpeg.exe -hide_banner -v error -f lavfi -i "testsrc2=s=3840x2160:r=60000/1001:d=2,format=yuv420p10le" -f lavfi -i "sine=d=2" -c:v libx265 -preset ultrafast -c:a aac -shortest test4k.mp4
          $env:PATH = "$PWD/dist/DTME/bin;$env:PATH"
          $env:PYTHONIOENCODING = "utf-8"
          python tests/test_engine_min.py test4k.mp4
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_layers.py test4k.mp4 layer_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_transitions.py test4k.mp4 trans_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_reframe.py test4k.mp4 reframe_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_gkeys.py test4k.mp4 gkeys_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_gkeys_cuts.py test4k.mp4 gkeys_cuts_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_quality.py test4k.mp4 quality_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_dive.py dive_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_titles.py test4k.mp4 titles_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_auto.py auto_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_range_cache.py test4k.mp4
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_preview.py preview_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_shutdown.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_gates.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_ui_srcrender.py srcrender_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_chunks.py chunks_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_ui_renderprog.py renderprog_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_outputs.py outputs_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_launch_done.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_curvekeys.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_ui_v1634.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_ui_v1635.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_lastonly.py test4k.mp4
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_ui_live.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_encoders.py test4k.mp4 enc_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_ui_v1641.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_hw.py test4k.mp4 hw_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_ui_samples.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_insta.py insta_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_ui_presetclose.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_ui_rendercancel.py rendercancel_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_ui_v1655.py v1655_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_ui_start.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_auto_rich.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_auto_measure.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_auto_deeprun.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_title_anim.py titleanim_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_ui_titleanim.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_rect_style.py rectstyle_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_music.py music_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_ui_music.py music_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_loud.py loud_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_ui_loud.py loud_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_ui_v1667.py v1667_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $o3 = python tests/test_ui_v1670.py v1670_test 2>&1 | Out-String
          Write-Output $o3
          if ($o3 -notmatch "OK test_ui_v1670") { exit 1 }
          $global:LASTEXITCODE = 0
          $o_v1671 = python tests/test_ui_v1671.py v1671_test 2>&1 | Out-String
          Write-Output $o_v1671
          if ($o_v1671 -notmatch "OK test_ui_v1671") { exit 1 }
          $global:LASTEXITCODE = 0
          $o_v1672 = python tests/test_ui_v1672.py v1672_test 2>&1 | Out-String
          Write-Output $o_v1672
          if ($o_v1672 -notmatch "OK test_ui_v1672") { exit 1 }
          $global:LASTEXITCODE = 0
          python tests/test_music_scene.py musicscene_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $o_v1674 = python tests/test_ui_v1674.py v1674_test 2>&1 | Out-String
          Write-Output $o_v1674
          if ($o_v1674 -notmatch "OK test_ui_v1674") { exit 1 }
          $global:LASTEXITCODE = 0
          $o_v1675 = python tests/test_ui_v1675.py v1675_test 2>&1 | Out-String
          Write-Output $o_v1675
          if ($o_v1675 -notmatch "OK test_ui_v1675") { exit 1 }
          $global:LASTEXITCODE = 0
          $o_v1676 = python tests/test_ui_v1676.py v1676_test 2>&1 | Out-String
          Write-Output $o_v1676
          if ($o_v1676 -notmatch "OK test_ui_v1676") { exit 1 }
          $global:LASTEXITCODE = 0
          python tests/test_rotate_gpu.py rotgpu_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $o_v1678 = python tests/test_ui_v1678.py v1678_test 2>&1 | Out-String
          Write-Output $o_v1678
          if ($o_v1678 -notmatch "OK test_ui_v1678") { exit 1 }
          $global:LASTEXITCODE = 0
          $o_v1680 = python tests/test_ui_v1680.py v1680_test 2>&1 | Out-String
          Write-Output $o_v1680
          if ($o_v1680 -notmatch "OK test_ui_v1680") { exit 1 }
          $global:LASTEXITCODE = 0
          $o_v1681 = python tests/test_ui_v1681.py v1681_test 2>&1 | Out-String
          Write-Output $o_v1681
          if ($o_v1681 -notmatch "OK test_ui_v1681") { exit 1 }
          $global:LASTEXITCODE = 0
          $o_v1684 = python tests/test_ui_v1684.py v1684_test 2>&1 | Out-String
          Write-Output $o_v1684
          if ($o_v1684 -notmatch "OK test_ui_v1684") { exit 1 }
          $global:LASTEXITCODE = 0
          # v0.16.92 렌더가 길어 빌드를 1시간 넘게 막음 → 15분 넘으면 끄고 경고만
          $pv = Start-Process python -ArgumentList "tests/test_ui_v1691.py","v1691_test" -NoNewWindow -PassThru -RedirectStandardOutput v1691_out.txt -RedirectStandardError v1691_err.txt
          if (-not $pv.WaitForExit(900000)) { Write-Output "::warning::test_ui_v1691 15분 넘음 — 끔"; & taskkill /T /F /PID $pv.Id | Out-Null; Start-Sleep -Seconds 3 }
          $o_v1691 = (Get-Content v1691_out.txt -Raw -ErrorAction SilentlyContinue) + (Get-Content v1691_err.txt -Raw -ErrorAction SilentlyContinue)
          Write-Output $o_v1691
          if ($o_v1691 -notmatch "OK test_ui_v1691") { Write-Output "::warning::OK test_ui_v1691 실패(빌드는 계속 — 사용자 11/14 12:40: 되는 부분 먼저 빌드)" }
          $global:LASTEXITCODE = 0
          python tests/test_browse.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $o_sa = python tests/test_ui_selectall.py selectall_test 2>&1 | Out-String
          Write-Output $o_sa
          if ($o_sa -notmatch "OK test_ui_selectall") { exit 1 }
          $global:LASTEXITCODE = 0
          $o_rw = python tests/test_ui_renderwin.py renderwin_test 2>&1 | Out-String
          Write-Output $o_rw
          if ($o_rw -notmatch "OK test_ui_renderwin") { Write-Output "::warning::OK test_ui_renderwin 실패(빌드는 계속 — 사용자 11/14 12:40: 되는 부분 먼저 빌드)" }
          $global:LASTEXITCODE = 0
          # 끝난 뒤 Windows 종료 단계에서 접근 위반(시험 내용과 무관, test_ui_autocheck 와 같음 — 실측 2026-11-13) → 결과 줄로 판정
          $o2 = python tests/test_autoedit.py autoedit_test 2>&1 | Out-String
          Write-Output $o2
          if ($o2 -notmatch "OK test_autoedit") { exit 1 }
          $global:LASTEXITCODE = 0
          # 끝난 뒤 Windows 종료 단계에서 가끔 접근 위반(테스트 내용과 무관, 원인 미확인) → 결과 줄로 판정
          $o = python tests/test_ui_autocheck.py 2>&1 | Out-String
          Write-Output $o
          if ($o -notmatch "OK test_ui_autocheck") { exit 1 }
          $global:LASTEXITCODE = 0

      - name: Smoke test (exe 실행)
        shell: pwsh
        run: |
          $env:DTME_SELFTEST = "1"
          $p = Start-Process dist/DTME/DTME.exe -Wait -PassThru
          Write-Host "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          Remove-Item -Recurse -Force dist/DTME/cache -ErrorAction SilentlyContinue
          Remove-Item -Force dist/DTME/luts/_ci_identity.cube -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: DTME-${{ steps.ver.outputs.version }}-windows
          path: dist/DTME
          retention-days: 30

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/DTME -DestinationPath DTME-${{ steps.ver.outputs.version }}-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DTME-${{ steps.ver.outputs.version }}-windows.zip
